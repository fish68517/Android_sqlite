plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hakimi'
    compileSdk 34

    def siliconFlowBaseUrl = (project.findProperty("siliconflow.baseUrl")
            ?: "https://api.siliconflow.cn/v1").toString()
    def siliconFlowApiKey = (project.findProperty("siliconflow.apiKey")
            ?: "").toString()
    def siliconFlowModel = (project.findProperty("siliconflow.model")
            ?: "tencent/Hunyuan-MT-7B").toString()

    defaultConfig {
        applicationId "com.hakimi"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SILICONFLOW_BASE_URL", "\"${siliconFlowBaseUrl}\""
        buildConfigField "String", "SILICONFLOW_API_KEY", "\"${siliconFlowApiKey}\""
        buildConfigField "String", "SILICONFLOW_MODEL", "\"${siliconFlowModel}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    
    // Retrofit缃戠粶璇锋眰
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    
    // 鍥剧墖鍔犺浇
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    // WebSocket
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'



    
    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    
    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // 鏉冮檺绠＄悊
    implementation 'com.github.permissions-dispatcher:permissionsdispatcher:4.9.2'
    
    // 鍒锋柊鎺т欢
    implementation 'com.scwang.smart:refresh-layout-kernel:2.0.3'
    implementation 'com.scwang.smart:refresh-header-classics:2.0.3'
    implementation 'com.scwang.smart:refresh-footer-classics:2.0.3'
    
    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // NestedScrollView
    implementation 'androidx.core:core:1.12.0'


        // RxJava 鏍稿績搴?

    // RxAndroid: 涓篟xJava鎻愪緵Android涓荤嚎绋嬭皟搴﹀櫒绛夊姛鑳?

    // Retrofit 鐨?RxJava 3 閫傞厤鍣紝璁?Retrofit 鐨勬帴鍙ｆ柟娉曞彲浠ヨ繑鍥?Observable, Single 绛?
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
