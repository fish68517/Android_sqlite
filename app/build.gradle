plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { inputStream ->
        localProperties.load(inputStream)
    }
}

def readProjectConfig = { String key, String defaultValue ->
    def value = project.findProperty(key)
    if (value == null || value.toString().trim().isEmpty()) {
        value = localProperties.getProperty(key)
    }
    if (value == null || value.toString().trim().isEmpty()) {
        value = defaultValue
    }
    return value.toString().trim()
}

def asBuildConfigString = { String value ->
    return "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
}

android {
    namespace 'com.localmusic.player'
    compileSdk 34

    def siliconFlowBaseUrl = readProjectConfig("siliconflow.baseUrl", "https://api.siliconflow.cn/v1")
    def siliconFlowApiKey = readProjectConfig("siliconflow.apiKey", "")
    def siliconFlowModel = readProjectConfig("siliconflow.model", "tencent/Hunyuan-MT-7B")

    defaultConfig {
        applicationId "com.localmusic.player"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SILICONFLOW_BASE_URL", asBuildConfigString(siliconFlowBaseUrl)
        buildConfigField "String", "SILICONFLOW_API_KEY", asBuildConfigString(siliconFlowApiKey)
        buildConfigField "String", "SILICONFLOW_MODEL", asBuildConfigString(siliconFlowModel)
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
